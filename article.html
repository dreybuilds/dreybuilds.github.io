<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | dreybuilds</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="site-header container">
    <a class="brand" href="index.html">◎ Audrey</a>
  </header>

  <main class="container section" id="content">
    <h2>Loading article...</h2>
  </main>

  <footer class="site-footer container">
    <small>© <span id="year"></span> Audrey Nzilani</small>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const content = document.getElementById("content");

    if (!file) {
      content.innerHTML = "<p>No article specified.</p>";
    } else {
      fetch(`articles/${file}`)
        .then(res => {
          if (!res.ok) throw new Error("Not found");
          return res.text();
        })
        .then(md => {
          const lines = md.split("\n");
          let tags = [];

          if (lines[1] && lines[1].trim().startsWith("@")) {
            tags = lines[1]
              .trim()
              .split(/\s+/)
              .filter(t => t.startsWith("@"));

            md = [lines[0], ...lines.slice(2)].join("\n");
          }

          const html = marked.parse(md);

          const tagsHTML = tags.length
            ? `<div class="tag-row">
                ${tags.map(t => `<span class="chip">#${t.slice(1)}</span>`).join("")}
              </div>`
            : "";

          content.innerHTML = `
            <div class="card">
              ${tagsHTML}
              ${html}
            </div>
          `;
        })
        .catch(err => {
          content.innerHTML = `<p>⚠️ Could not load this article (${err.message}).</p>`;
        });
    }
  </script>
</body>
</html>
