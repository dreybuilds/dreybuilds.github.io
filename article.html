<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light">
  <title>Articles | dreybuilds</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header class="site-header container">
    <a class="brand" href="index.html">◎ Audrey</a>
  </header>

  <main class="container section">
    <h1>Articles</h1>

    <!-- Tag Filter Bar -->
    <div id="tag-filter" class="tag-row"></div>

    <!-- Articles Grid -->
    <div id="articles-grid" class="grid"></div>
  </main>

  <footer class="site-footer container">
    <small>© <span id="year"></span> Audrey Nzilani</small>
  </footer>

  <script>
    const year = document.getElementById("year");
    year.textContent = new Date().getFullYear();

    let activeTag = null;

    fetch("articles.json")
      .then(res => res.json())
      .then(articles => {
        const allTags = new Set();
        articles.forEach(a => a.tags.forEach(t => allTags.add(t)));

        const tagFilter = document.getElementById("tag-filter");
        const grid = document.getElementById("articles-grid");

        // Render tag chips
        tagFilter.innerHTML = Array.from(allTags)
          .map(tag => `<span class="chip tag-chip" data-tag="${tag}">#${tag}</span>`)
          .join("");

        // Function to render articles
        const renderArticles = (tag = null) => {
          grid.innerHTML = articles
            .filter(a => !tag || a.tags.includes(tag))
            .map(a => `
              <article class="card">
                <h3>${a.title}</h3>
                <p>${a.desc}</p>
                <div class="chip-row">
                  <a class="chip" href="article.html?file=${a.file}">Read</a>
                  ${a.tags.map(t => `<span class="chip subtag">#${t}</span>`).join("")}
                </div>
              </article>
            `)
            .join("");
        };

        // Initial render
        renderArticles();

        // Tag click filtering
        tagFilter.addEventListener("click", e => {
          if (e.target.dataset.tag) {
            const clickedTag = e.target.dataset.tag;
            activeTag = activeTag === clickedTag ? null : clickedTag;
            document.querySelectorAll(".tag-chip").forEach(c => 
              c.classList.toggle("active", c.dataset.tag === activeTag)
            );
            renderArticles(activeTag);
          }
        });
      });
  </script>

  <style>
    /* Add minimal filtering UI */
    .tag-chip.active {
      color: var(--accent);
      border-color: var(--accent);
      background: color-mix(in oklab, var(--accent) 20%, transparent);
    }
    .subtag {
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</body>
</html>
